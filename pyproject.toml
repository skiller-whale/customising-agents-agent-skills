[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whalepage"
version = "0.1.0"
description = "Build a single static HTML page from Markdown"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1,<4",
    "markdown-it-py>=4,<5",
    "PyYAML>=6,<7",
]

[project.scripts]
whalepage = "whalepage.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
