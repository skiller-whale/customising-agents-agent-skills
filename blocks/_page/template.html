<!doctype html>
<html lang="{{ page.language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <style>
{{ styles }}
    </style>
  </head>
  <body>
    <main>
{{ body }}
    </main>
    {% if scripts %}<script>
{{ scripts }}
    </script>{% endif %}
  </body>
</html>
